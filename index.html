<style>
:root{--motion-fast:160ms;--motion:240ms;--motion-slow:360ms;--ease:cubic-bezier(.22,.61,.36,1)}

button:active,.btn:active{transform:scale(.97)}
.sidebar .nav button:hover{transform:translateX(2px)}
.sidebar .nav button.active{animation:navActive var(--motion) var(--ease)}
@keyframes navActive{from{opacity:.7;transform:translateX(-3px)}to{opacity:1;transform:translateX(0)}}
.page-animate{animation:pageIn var(--motion-slow) var(--ease) both}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stat,.card{animation:cardIn var(--motion-slow) var(--ease) both}
@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.modal-back{animation:backdropIn 180ms ease both}.modal{animation:modalIn 260ms var(--ease) both}

.toast{animation:toastIn 280ms var(--ease) both}@keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.login-card{animation:loginIn 480ms var(--ease) both}.login-card>.logo{animation:logoIn 650ms var(--ease) both}
@keyframes loginIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes logoIn{0%{opacity:0;transform:scale(.75)}70%{transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
.splash-screen{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:#f2f2f7;animation:splashOut 700ms 900ms var(--ease) forwards;pointer-events:none}

<script>
const SUPABASE_URL="https://gbnonclccokylumageyi.supabase.co";
const SUPABASE_KEY="sb_publishable_3STLdysvJrtk66W7vQ3Fng_ak4sech7";
let currentUser=null,currentPage="home";

const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const money=v=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(v||0));
const num=v=>Number(v||0);
const today=()=>new Date().toISOString().slice(0,10);
const dt=v=>v?new Date(v).toLocaleString("id-ID",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"-";
const q=v=>encodeURIComponent(String(v??""));

async function api(path,opt={}){
 const h={apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,Accept:"application/json"};
 if(opt.body!==undefined)h["Content-Type"]="application/json";
 if(opt.prefer)h.Prefer=opt.prefer;
 let r;try{r=await fetch(SUPABASE_URL+path,{method:opt.method||"GET",headers:h,body:opt.body===undefined?undefined:JSON.stringify(opt.body)})}catch(e){throw Error("Tidak bisa terhubung ke Supabase.")}
 const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch(e){d=t}
 if(!r.ok)throw Error(d?.message||d?.details||d?.hint||t||("HTTP "+r.status));return d;
}
const get=(t,p)=>api("/rest/v1/"+t+"?"+p);
const post=(t,b)=>api("/rest/v1/"+t+"?select=*",{method:"POST",body:b,prefer:"return=representation"});
const patch=(t,p,b)=>api("/rest/v1/"+t+"?"+p,{method:"PATCH",body:b,prefer:"return=representation"});
const del=(t,p)=>api("/rest/v1/"+t+"?"+p,{method:"DELETE"});
const rpc=(n,b)=>api("/rest/v1/rpc/"+n,{method:"POST",body:b});

function toast(m,type="ok"){const x=document.createElement("div");x.className="toast "+(type==="error"?"err":"ok");x.textContent=m;document.getElementById("toast-root").appendChild(x);setTimeout(()=>x.remove(),3300)}
function modal(title,body){document.getElementById("modal-root").innerHTML=`<div class="modal-back" id="mb"><div class="modal"><div class="modal-head"><h3>${title}</h3><button class="x" onclick="closeModal()">×</button></div>${body}</div></div>`;document.getElementById("mb").onclick=e=>{if(e.target.id==="mb")closeModal()}}

function showPage(page){
 currentPage=page;
 renderShell();
}
function renderShell(){
 if(!currentUser){renderLogin();return}
 const allowed=menus.filter(m=>owner()||!["finance","owner"].includes(m[0]));
 document.getElementById("root").innerHTML=`<div class="shell">
 <aside class="sidebar"><div class="brand"><div class="logo">M</div><div class="profile-brand"><div class="profile-role" id="side-role">OWNER</div><div class="profile-name" id="side-name">Owner Mardelle</div></div></div><div class="nav-title">MENU</div><nav class="nav">${allowed.map(m=>`<button class="${currentPage===m[0]?"active":""}" onclick="showPage('${m[0]}')"><img class="nav-png-icon" src="${m[2]}" alt=""><span>${m[1]}</span></button>`).join("")}</nav><div class="sidebar-logout"><button type="button" onclick="logout()">↪ <span>Log out</span></button></div></aside>
 <section class="main"><header class="topbar"><div class="user">${currentUser.role.toUpperCase()} · ${esc(currentUser.full_name)}</div>${B("Logout","logout()")}</header><main class="content" id="content"></main></section>
 <nav class="mobile-nav">${allowed.slice(0,5).map(m=>`<button class="${currentPage===m[0]?"active":""}" onclick="showPage('${m[0]}')"><span class="nav-icon">${m[2]}</span><span>${m[1]}</span></button>`).join("")}</nav></div>`;
 const fn={home:pageHome,stok:pageStock,barang:pageBarang,pos:pagePOS,customer:pageCustomer,history:pageHistory,finance:pageFinance,owner:pageOwner}[currentPage]||pageHome;
 Promise.resolve(fn(document.getElementById("content"))).catch(e=>{console.error(e);document.getElementById("content").innerHTML=`<div class="card" style="padding:20px"><b style="color:#b91c1c">Halaman gagal dimuat</b><p class="small">${esc(e.message)}</p>${B("Coba lagi","showPage('"+currentPage+"')")}</div>`});
}
function renderLogin(){
 document.getElementById("root").innerHTML=`<div class="login-screen"><div class="card login-card"><div class="logo">M</div><h1>Mardelle Phone</h1><p>HP Management System</p><form id="lf"><div class="field" style="margin-top:22px"><label>PIN OWNER / STAFF</label><input id="pin" class="input" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off" required></div><button id="lb" class="btn primary" style="width:100%;margin-top:14px">Masuk Sistem</button></form><div id="ls" class="login-status">Supabase siap.</div></div></div>`;
 document.getElementById("lf").onsubmit=login;
}
async function login(e){
 e.preventDefault();const b=document.getElementById("lb"),s=document.getElementById("ls"),pin=document.getElementById("pin").value.trim();b.disabled=true;b.textContent="Menghubungkan...";s.textContent="Menghubungkan ke Supabase...";
 try{const r=await get("profiles","select=id,full_name,role,pin&pin=eq."+q(pin)+"&limit=1");if(!r?.length)throw Error("PIN tidak ditemukan.");currentUser=r[0];currentPage="home";renderShell()}catch(x){s.textContent="Login gagal: "+x.message;toast(x.message,"error")}finally{b.disabled=false;b.textContent="Masuk Sistem"}
}
function logout(){currentUser=null;currentPage="home";renderLogin()}

async function pageHome(el){
 const inv=await get("inventory_items","select=status"),avail=(inv||[]).filter(x=>x.status==="Tersedia").length,sold=(inv||[]).filter(x=>x.status==="Terjual").length;
 const recent=await get("sales_history","select=*&order=transaction_date.desc&limit=8");
 let revenue=0,profit=0;try{const a=await get("transaction_items","select=price,profit,transactions!inner(type)&transactions.type=eq.Penjualan");revenue=(a||[]).reduce((x,y)=>x+num(y.price),0);profit=(a||[]).reduce((x,y)=>x+num(y.profit),0)}catch(e){}
 el.innerHTML=`<div class="header"><div><h2>Dashboard</h2><p>Ringkasan operasional Mardelle Phone</p></div></div><div class="grid g4">${stat("Omzet",money(revenue),"Total penjualan")}${stat("Profit",owner()?money(profit):"••••••","Owner only")}${stat("Terjual",sold,"Unit terjual")}${stat("Stok",avail,"Unit tersedia")}</div>
 <div class="grid g2" style="margin-top:14px"><div class="card"><div class="split" style="padding:18px"><div><b>Transaksi Terbaru</b><div class="small sub">Penjualan</div></div>${B("Lihat","showPage('history')")}</div><div class="table-wrap"><table class="table"><thead><tr><th>Invoice</th><th>Produk</th><th>Customer</th><th class="right">Harga</th></tr></thead><tbody>${(recent||[]).map(r=>`<tr><td class="bold">${esc(r.invoice)}</td><td>${esc(r.brand)} ${esc(r.model)}</td><td>${esc(r.customer_name)}</td><td class="right">${money(r.sale_price)}</td></tr>`).join("")||`<tr><td colspan="4" class="empty">Belum ada transaksi.</td></tr>`}</tbody></table></div></div>
 <div class="card" style="padding:18px"><b>Quick Actions</b><div class="stack" style="margin-top:14px">${B("＋ Barang Masuk","showPage('barang')",true)}${B("＋ Penjualan","showPage('pos')")}${B("＋ Customer","newCustomer()")}${owner()?B("＋ Pengeluaran","newExpense()"):""}</div></div></div>`;
}

async function pageStock(el){
  let rows=[];
  try{
    rows=await get("inventory_overview","select=*&order=created_at.desc");
  }catch(e){
    el.innerHTML=`<div class="card stock-error">
      <b>Gagal memuat stok</b>
      <p class="sub">Periksa koneksi/database lalu coba lagi.</p>
      <button class="btn secondary" onclick="syncStockCards()">↻ Coba lagi</button>
    </div>`;
    return;
  }

  rows=rows||[];
  const normalize=v=>String(v??"").trim().toLowerCase();
  const availableRows=rows.filter(i=>normalize(i.status)==="tersedia");
  const outRows=rows.filter(i=>normalize(i.status)==="habis");

  /* Restock rule:
     One available unit remaining for a product variant = needs restock.
     This is intentionally data-driven from current inventory rows. */
  const variantMap=new Map();
  availableRows.forEach(i=>{
    const key=[
      i.brand,i.model,i.storage,i.color
    ].map(v=>String(v??"").trim().toLowerCase()).join("|");
    variantMap.set(key,(variantMap.get(key)||0)+1);
  });
  const restockKeys=new Set(
    [...variantMap.entries()].filter(([,qty])=>qty<=1).map(([key])=>key)
  );
  const restockRows=availableRows.filter(i=>{
    const key=[i.brand,i.model,i.storage,i.color]
      .map(v=>String(v??"").trim().toLowerCase()).join("|");
    return restockKeys.has(key);
  });

  el.innerHTML=`<div class="header stock-page-header">
    <div>
      <h2>Stok & IMEI</h2>
      <p>Kelola unit, IMEI, status stok, dan kebutuhan restok</p>
    </div>
    <div class="actions stock-page-actions">
      <button class="btn secondary" id="stock-sync-btn" onclick="syncStockCards()">↻ Sinkron</button>
      ${owner()?B("＋ Produk","newProduct()",true):""}
    </div>
  </div>

  <div class="card stock-workspace">
    <div class="stock-controls">
      <div class="stock-search">
        <span class="stock-icon">⌕</span>
        <input id="ss" class="input" autocomplete="off"
          placeholder="Cari model, IMEI, supplier..."
          aria-label="Cari stok">
      </div>
      <select id="sf" class="input stock-select" aria-label="Filter status">
        <option value="">Semua status</option>
        <option value="tersedia">Tersedia</option>
        <option value="terjual">Terjual</option>
        <option value="habis">Habis</option>
      </select>
      <button class="btn secondary" onclick="resetStockFilter()">Reset</button>
    </div>

    <div class="stock-resultbar">
      <span id="stock-result-count">${rows.length} unit</span>
      <span id="stock-filter-label">Semua stok</span>
    </div>

    <div class="table-wrap">
      <table class="table">
        <thead><tr>
          <th>Produk</th>
          <th>IMEI</th>
          <th>Status</th>
          ${owner()?'<th>HPP</th>':''}
          <th>Harga</th>
          <th>Supplier</th>
          <th></th>
        </tr></thead>
        <tbody>
          ${rows.length?rows.map(i=>{
            const key=[i.brand,i.model,i.storage,i.color]
              .map(v=>String(v??"").trim().toLowerCase()).join("|");
            const needsRestock=normalize(i.status)==="tersedia" && restockKeys.has(key);
            const status=normalize(i.status);
            return `<tr class="sr"
              data-s="${esc([i.brand,i.model,i.storage,i.color,i.imei,i.supplier].map(v=>String(v??"")).join(" ").toLowerCase())}"
              data-st="${esc(status)}"
              data-restock="${needsRestock?"1":"0"}">
              <td>
                <b>${esc(i.brand||"")} ${esc(i.model||"")}</b>
                <div class="tiny sub">${esc(i.storage||"-")} · ${esc(i.color||"-")}</div>
              </td>
              <td>${esc(i.imei||"-")}</td>
              <td><span class="pill ${status==="tersedia"?"ok":status==="terjual"?"warn":"red"}">${esc(i.status||"-")}</span></td>
              ${owner()?`<td>${money(i.cost_price)}</td>`:""}
              <td>${money(i.sale_price)}</td>
              <td>${esc(i.supplier||"-")}</td>
              <td class="right">
                ${B("Detail","editStock('"+i.id+"')")}
                ${owner()?B("Hapus","deleteStock('"+i.id+"')",false,true):""}
              </td>
            </tr>`;
          }).join(""):`<tr><td colspan="${owner()?7:6}" class="empty">Belum ada stok.</td></tr>`}
        </tbody>
      </table>
    </div>
  </div>`;

  window.__stockRows=rows;
  window.__stockRestockKeys=restockKeys;

  const apply=()=>{
    const s=normalize(document.getElementById("ss")?.value);
    const st=normalize(document.getElementById("sf")?.value);
    let visible=0;

    document.querySelectorAll(".sr").forEach(r=>{
      const matchSearch=!s||r.dataset.s.includes(s);
      const matchStatus=!st||r.dataset.st===st;
      const show=matchSearch&&matchStatus;
      r.style.display=show?"":"none";
      if(show) visible++;
    });

    const label=st==="tersedia"?"Stok tersedia":
      st==="terjual"?"Terjual":
      st==="habis"?"Produk habis":"Semua stok";

    const count=document.getElementById("stock-result-count");
    const filterLabel=document.getElementById("stock-filter-label");
    if(count) count.textContent=`${visible} unit`;
    if(filterLabel) filterLabel.textContent=s?`${label} · pencarian aktif`:label;
  };

  document.getElementById("ss").oninput=apply;
  document.getElementById("sf").onchange=apply;
  window.__applyStockFilter=apply;
  apply();
}

  const status=document.getElementById("sf");

  if(status)status.value="";
  if(window.__applyStockFilter)window.__applyStockFilter();
}

async function pageCustomer(el){
 const rows=await get("customers","select=*&order=created_at.desc");
 el.innerHTML=`<div class="header"><div><h2>Customer</h2><p>Data pelanggan</p></div>${B("＋ Tambah Customer","newCustomer()",true)}</div><div class="toolbar"><input id="cs" class="input search" placeholder="Cari nama / HP"></div><div class="card table-wrap"><table class="table"><thead><tr><th>Nama</th><th>HP</th><th>Dibuat</th><th></th></tr></thead><tbody>${(rows||[]).map(c=>`<tr class="cr" data-s="${esc((c.name+" "+(c.phone||"")).toLowerCase())}"><td class="bold">${esc(c.name)}</td><td>${esc(c.phone||"-")}</td><td>${dt(c.created_at)}</td><td class="right">${B("Detail","customerDetail('"+c.id+"')")} ${B("Edit","editCustomer('"+c.id+"')")} ${owner()?B("Hapus","deleteCustomer('"+c.id+"')",false,true):""}</td></tr>`).join("")||`<tr><td colspan="4" class="empty">Belum ada customer.</td></tr>`}</tbody></table></div>`;cs.oninput=()=>{const s=cs.value.toLowerCase();document.querySelectorAll(".cr").forEach(r=>r.style.display=!s||r.dataset.s.includes(s)?"":"none")};
}
function newCustomer(existing=null){const c=existing||{name:"",phone:""};modal(existing?"Edit Customer":"Tambah Customer",`<form id="cf"><div class="field"><label>Nama</label><input id="cn" class="input" value="${esc(c.name)}" required></div><div class="field" style="margin-top:14px"><label>No. HP</label><input id="cp" class="input" value="${esc(c.phone||"")}"></div><button class="btn primary" style="width:100%;margin-top:14px">${existing?"Simpan":"Tambah"}</button></form>`);document.getElementById("cf").onsubmit=async e=>{e.preventDefault();try{const row={name:cn.value.trim(),phone:cp.value.trim()};if(existing)await patch("customers","id=eq."+q(existing.id),row);else await post("customers",row);closeModal();toast("Customer tersimpan");showPage("customer")}catch(x){toast(x.message,"error")}}}
async function editCustomer(id){const c=(await get("customers","select=*&id=eq."+q(id)+"&limit=1"))?.[0];if(c)newCustomer(c)}
async function customerDetail(id){const c=(await get("customers","select=*&id=eq."+q(id)+"&limit=1"))?.[0];if(!c)return;const s=await get("sales_history","select=*&customer_id=eq."+q(id)+"&order=transaction_date.desc");modal("Detail Customer",`<div class="muted"><b>${esc(c.name)}</b><div class="small sub">${esc(c.phone||"-")}</div></div><div style="margin-top:18px"><b>Riwayat Pembelian</b><div class="table-wrap" style="margin-top:10px"><table class="table"><thead><tr><th>Invoice</th><th>Produk</th><th>Harga</th></tr></thead><tbody>${(s||[]).map(x=>`<tr><td>${esc(x.invoice)}</td><td>${esc(x.brand)} ${esc(x.model)}</td><td>${money(x.sale_price)}</td></tr>`).join("")||`<tr><td colspan="3" class="empty">Belum ada.</td></tr>`}</tbody></table></div></div>`)}
async function deleteCustomer(id){if(!owner())return;if(!confirm("Hapus customer?"))return;try{await del("customers","id=eq."+q(id));toast("Customer dihapus");showPage("customer")}catch(x){toast(x.message,"error")}}

async function pageHistory(el){
 const rows=await get("sales_history","select=*&order=transaction_date.desc");
 el.innerHTML=`<div class="header"><div><h2>Riwayat Transaksi</h2><p>Riwayat penjualan</p></div></div><div class="toolbar"><input id="hs" class="input search" placeholder="Cari invoice / customer / IMEI"></div><div class="card table-wrap"><table class="table"><thead><tr><th>Invoice</th><th>Tanggal</th><th>Customer</th><th>Produk</th><th>IMEI</th><th>Status</th><th class="right">Harga</th>${owner()?"<th></th>":""}</tr></thead><tbody>${(rows||[]).map(r=>`<tr class="hr" data-s="${esc((r.invoice+" "+r.customer_name+" "+(r.imei||"")+" "+r.brand+" "+r.model).toLowerCase())}"><td class="bold">${esc(r.invoice)}</td><td>${dt(r.transaction_date)}</td><td>${esc(r.customer_name)}</td><td>${esc(r.brand)} ${esc(r.model)}</td><td>${esc(r.imei||"-")}</td><td><span class="pill">${esc(r.payment_status||"-")}</span></td><td class="right">${money(r.sale_price)}</td>${owner()?`<td>${B("Hapus","deleteTransaction('"+r.transaction_id+"')",false,true)}</td>`:""}</tr>`).join("")||`<tr><td colspan="8" class="empty">Belum ada.</td></tr>`}</tbody></table></div>`;hs.oninput=()=>{const s=hs.value.toLowerCase();document.querySelectorAll(".hr").forEach(r=>r.style.display=!s||r.dataset.s.includes(s)?"":"none")};
}
async function deleteTransaction(id){if(!owner())return;if(!confirm("Hapus transaksi dan kembalikan stok?"))return;try{const it=await get("transaction_items","select=inventory_item_id&transaction_id=eq."+q(id));for(const x of it||[]){if(x.inventory_item_id)await patch("inventory_items","id=eq."+q(x.inventory_item_id),{status:"Tersedia"})}await del("transactions","id=eq."+q(id));toast("Transaksi dihapus");showPage("history")}catch(x){toast(x.message,"error")}}

async function pageFinance(el){
 if(!owner()){el.innerHTML=`<div class="card" style="padding:20px"><b>Akses Owner saja.</b></div>`;return}
 const rows=await get("expenses","select=*&order=expense_date.desc,created_at.desc"),total=(rows||[]).reduce((a,x)=>a+num(x.amount),0);
 el.innerHTML=`<div class="header"><div><h2>Keuangan</h2><p>Pengeluaran operasional</p></div>${B("＋ Pengeluaran","newExpense()",true)}</div><div class="grid g3" style="margin-bottom:14px">${stat("Total Expense",money(total),"Semua pengeluaran")}${stat("Catatan",(rows||[]).length,"Jumlah expense")}${stat("Kategori",new Set((rows||[]).map(x=>x.category).filter(Boolean)).size,"Kategori")}</div><div class="card table-wrap"><table class="table"><thead><tr><th>Tanggal</th><th>Deskripsi</th><th>Kategori</th><th>Metode</th><th class="right">Nominal</th><th></th></tr></thead><tbody>${(rows||[]).map(x=>`<tr><td>${x.expense_date}</td><td class="bold">${esc(x.description)}</td><td>${esc(x.category||"-")}</td><td>${esc(x.payment_method||"-")}</td><td class="right">${money(x.amount)}</td><td>${B("Edit","editExpense('"+x.id+"')")} ${B("Hapus","deleteExpense('"+x.id+"')",false,true)}</td></tr>`).join("")||`<tr><td colspan="6" class="empty">Belum ada.</td></tr>`}</tbody></table></div>`;
}
function newExpense(existing=null){if(!owner())return toast("Hanya Owner","error");const x=existing||{description:"",amount:0,category:"",payment_method:"Cash",expense_date:today(),notes:""};modal(existing?"Edit Pengeluaran":"Tambah Pengeluaran",`<form id="ef" class="form-grid"><div class="field full"><label>Deskripsi</label><input id="ed" class="input" value="${esc(x.description)}" required></div><div class="field"><label>Nominal</label><input id="ea" class="input" type="number" value="${x.amount}" required></div><div class="field"><label>Kategori</label><input id="ec" class="input" value="${esc(x.category||"")}"></div><div class="field"><label>Metode</label><select id="em" class="select"><option>Cash</option><option>Transfer</option><option>E-Wallet</option></select></div><div class="field"><label>Tanggal</label><input id="edate" class="input" type="date" value="${x.expense_date}"></div><div class="field full"><label>Catatan</label><textarea id="en" class="textarea">${esc(x.notes||"")}</textarea></div><div class="field full"><button class="btn primary" style="width:100%">Simpan</button></div></form>`);em.value=x.payment_method||"Cash";document.getElementById("ef").onsubmit=async e=>{e.preventDefault();try{const row={description:ed.value.trim(),amount:num(ea.value),category:ec.value.trim(),payment_method:em.value,expense_date:edate.value,notes:en.value.trim()};if(existing)await patch("expenses","id=eq."+q(existing.id),row);else await post("expenses",row);closeModal();toast("Pengeluaran tersimpan");showPage("finance")}catch(x){toast(x.message,"error")}}}
async function editExpense(id){const x=(await get("expenses","select=*&id=eq."+q(id)+"&limit=1"))?.[0];if(x)newExpense(x)}
async function deleteExpense(id){if(!owner())return;if(!confirm("Hapus pengeluaran?"))return;try{await del("expenses","id=eq."+q(id));toast("Pengeluaran dihapus");showPage("finance")}catch(x){toast(x.message,"error")}}

async function pageOwner(el){
 if(!owner()){el.innerHTML=`<div class="card" style="padding:20px"><b>Akses Owner saja.</b></div>`;return}
 const s=(await get("owner_financial_overview","select=*&limit=1"))?.[0]||{},inv=await get("inventory_items","select=status,cost_price"),stock=(inv||[]).filter(x=>x.status==="Tersedia").reduce((a,x)=>a+num(x.cost_price),0);
 el.innerHTML=`<div class="header"><div><h2>Owner Financial</h2><p>Kontrol finansial Mardelle Phone</p></div>${B("↻ Refresh","showPage('owner')")}</div><div class="hero"><div class="tiny" style="opacity:.7">NET PROFIT</div><div class="value">${money(s.total_net_profit)}</div></div><div class="grid g4" style="margin-top:14px">${stat("Revenue",money(s.total_revenue),"Penjualan")}${stat("COGS",money(s.total_cogs),"HPP")}${stat("Gross Profit",money(s.total_gross_profit),"Revenue − COGS")}${stat("Expense",money(s.total_expenses),"Operasional")}</div><div class="grid g3" style="margin-top:14px">${stat("Nilai Stok",money(stock),"HPP stok tersedia")}${stat("Unit Tersedia",(inv||[]).filter(x=>x.status==="Tersedia").length,"Stok aktif")}${stat("Margin",num(s.total_revenue)?((num(s.total_gross_profit)/num(s.total_revenue))*100).toFixed(1)+"%":"0%","Gross margin")}</div><div class="grid g2" style="margin-top:14px"><div class="card" style="padding:20px"><b>Financial Flow</b><div style="margin-top:14px"><div class="split" style="padding:11px 0;border-bottom:1px solid var(--line)">Revenue <b>${money(s.total_revenue)}</b></div><div class="split" style="padding:11px 0;border-bottom:1px solid var(--line)">COGS <b>${money(s.total_cogs)}</b></div><div class="split" style="padding:11px 0;border-bottom:1px solid var(--line)">Gross Profit <b>${money(s.total_gross_profit)}</b></div><div class="split" style="padding:11px 0;border-bottom:1px solid var(--line)">Expense <b>${money(s.total_expenses)}</b></div><div class="split" style="padding:13px 0"><b>Net Profit</b><b>${money(s.total_net_profit)}</b></div></div></div><div class="card" style="padding:20px"><b>Owner Controls</b><div class="stack" style="margin-top:14px">${B("Keuangan","showPage('finance')",true)}${B("Stok","showPage('stok')")}${B("Customer","showPage('customer')")}${B("Riwayat","showPage('history')")}</div></div></div>`;
}

<script>
(function(){
  try{
    const u = window.currentUser || window.me || window.user || null;
    if(u){
      const role = String(u.role || "staff").toUpperCase();
      const name = u.full_name || u.name || (role==="OWNER" ? "Owner Mardelle" : "Staff Store");
      const r = document.getElementById("side-role");
      const n = document.getElementById("side-name");
      if(r) r.textContent = role;
      if(n) n.textContent = name;
    }
  }catch(e){}
})();
</script>
<script>
document.addEventListener("DOMContentLoaded",function(){
 const f=window.showPage;
 if(typeof f==="function"&&!window.__motion){
  window.showPage=function(){f.apply(this,arguments);requestAnimationFrame(function(){
   document.querySelectorAll(".content > *").forEach(function(e){e.classList.remove("page-animate");void e.offsetWidth;e.classList.add("page-animate")});
  })};window.__motion=true;
 }
});
</script>
<script>
(function(){
  const KEY="mardelle_session";

  function getSavedSession(){
    try{
      const raw=localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }

  function saveSession(user){
    try{
      localStorage.setItem(KEY, JSON.stringify({
        id:user.id,
        role:user.role,
        full_name:user.full_name
      }));
    }catch(e){}
  }

  function clearSession(){
    try{ localStorage.removeItem(KEY); }catch(e){}
  }

  window.mardelleSaveSession=saveSession;
  window.mardelleClearSession=clearSession;
  window.mardelleGetSession=getSavedSession;

  document.addEventListener("DOMContentLoaded", function(){
    const saved=getSavedSession();
    if(!saved) return;

    // Reuse the app's existing login success path when available.
    // If the app exposes a current-user object, restore it directly.
    window.currentUser=saved;
    window.user=saved;
    window.me=saved;

    // Hide login and show the existing app shell without changing page logic.
    const login=document.querySelector("#login, .login-screen, [data-page='login']");
    if(login) login.style.display="none";

    const app=document.querySelector(".shell, #app, .app-shell");
    if(app) app.style.display="grid";

    if(typeof window.showPage==="function"){
      try{ window.showPage("home"); }catch(e){}
    }
  });
})();
</script>

<script>
(function(){
  function hookLogin(){
    const fn=window.login;
    if(typeof fn!=="function" || fn.__mardelleWrapped) return false;
    function wrappedLogin(){
      const result=fn.apply(this,arguments);
      Promise.resolve(result).then(function(){
        const u=window.currentUser || window.user || window.me;
        if(u && u.id && u.role) window.mardelleSaveSession(u);
      });
      return result;
    }
    wrappedLogin.__mardelleWrapped=true;
    window.login=wrappedLogin;
    return true;
  }

  const timer=setInterval(function(){
    if(hookLogin()) clearInterval(timer);
  },100);
  setTimeout(function(){clearInterval(timer)},10000);

  // Expose a safe logout helper. Existing logout buttons can call this before their
  // current logout logic; local session is cleared immediately.
  window.mardelleLogout=function(){
    window.mardelleClearSession();
  };
})();
</script>

<script>
document.addEventListener("click",function(e){
  const el=e.target.closest("button,a");
  if(!el) return;
  const text=(el.textContent||"").trim().toLowerCase();
  if(text.includes("logout") || text.includes("log out") || text.includes("keluar")){
    try{ localStorage.removeItem("mardelle_session"); }catch(err){}
  }
},true);
</script>
