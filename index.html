.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th{background:var(--soft);color:var(--sub);font-size:10px;text-transform:uppercase;letter-spacing:.06em;text-align:left}.table th,.table td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle}.table .right{text-align:right}.empty{padding:35px!important;text-align:center;color:var(--sub)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.search{min-width:230px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field label{display:block;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}.field.full{grid-column:1/-1}

.login-screen{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(430px,100%);padding:28px}.login-card h1{font-size:28px;margin:0}.login-card p{color:var(--sub);margin:5px 0}.login-status{font-size:11px;color:var(--sub);min-height:18px;margin-top:12px}
.modal-back{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:18px;z-index:50}.modal{width:min(720px,100%);max-height:91vh;overflow:auto;background:#fff;border-radius:20px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h3{margin:0;font-size:20px}.x{border:0;background:var(--soft);border-radius:9px;width:35px;height:35px;font-size:18px}

.mobile-nav{display:none}
@media(max-width:900px){.logo{width:46px;height:46px;border-radius:14px}.shell{grid-template-columns:1fr}.sidebar{display:none}.content{padding:20px 15px 90px}.topbar{height:62px;padding:0 15px}.mobile-nav{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:20;padding:7px 3px}.mobile-nav button{border:0;background:transparent;color:#777;font-size:9px;font-weight:800}.mobile-nav button.active{color:#111}.mobile-nav span{display:block;font-size:17px}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}}

/* ===== iOS-inspired design system ===== */
:root{
 --bg:#f2f2f7;--card:rgba(255,255,255,.92);--ink:#111113;--sub:#8e8e93;
 --line:rgba(60,60,67,.13);--soft:#f2f2f7;--dark:#111113;
 --red:#ff3b30;--green:#34c759;--blue:#007aff;
 --shadow:0 8px 28px rgba(0,0,0,.055);--shadow-hover:0 12px 34px rgba(0,0,0,.08)
}
html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit}
button{transition:transform .12s ease,background .15s ease,box-shadow .15s ease}
button:active{transform:scale(.97)}
.card{background:var(--card);border:1px solid rgba(60,60,67,.10);border-radius:22px;box-shadow:var(--shadow);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.card:hover{box-shadow:var(--shadow-hover);transform:none}
.btn{border:0;background:#fff;border-radius:12px;padding:11px 16px;font-size:13px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.btn:hover{background:#f8f8fa}
.btn.primary{background:#111113;color:#fff;border:0;box-shadow:0 5px 14px rgba(0,0,0,.16)}
.btn.danger{background:#fff0ef;color:#ff3b30}
.input,.select,.textarea{border:1px solid rgba(60,60,67,.14);background:rgba(255,255,255,.9);border-radius:12px;padding:12px 13px;color:#111;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.02)}
.input:focus,.select:focus,.textarea:focus{border-color:rgba(0,122,255,.65);box-shadow:0 0 0 3px rgba(0,122,255,.10);outline:0}
.shell{grid-template-columns:250px minmax(0,1fr);background:var(--bg)}
.sidebar{background:rgba(255,255,255,.78)!important;border:1px solid rgba(60,60,67,.10)!important;border-radius:24px!important;box-shadow:0 8px 30px rgba(0,0,0,.05)!important;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.sidebar .logo{background:#111113!important;border-radius:15px!important;box-shadow:0 6px 16px rgba(0,0,0,.15)!important}
.sidebar .nav button{border:0!important;background:transparent!important;color:#68686d!important;box-shadow:none!important;border-radius:12px!important;font-weight:650!important}
.sidebar .nav button:hover{background:rgba(118,118,128,.08)!important;color:#111113!important}
.sidebar .nav button.active{background:#111113!important;color:#fff!important;box-shadow:0 5px 14px rgba(0,0,0,.12)!important}
.sidebar-logout button{background:rgba(118,118,128,.08)!important;border:0!important;color:#3a3a3c!important}
.profile-role{color:#8e8e93!important;font-weight:750!important}
.profile-name{color:#1c1c1e!important;font-weight:700!important}
.content{padding:32px 32px 50px}
.header h2{font-size:32px;letter-spacing:-.035em;font-weight:800}
.header p{color:#8e8e93}
.stat{background:rgba(255,255,255,.9)!important;border:0!important;border-radius:20px!important;padding:20px!important}
.stat:after{background:#f2f2f7!important}
.stat .label{color:#8e8e93}
.stat .value{font-size:28px;letter-spacing:-.025em}
.table-wrap{border-radius:20px;overflow:auto}
.table{font-size:13px}
.table th{background:#f2f2f7;color:#8e8e93;font-size:10px}
.table th,.table td{border-bottom:1px solid rgba(60,60,67,.10)}
.pill{border-radius:999px;padding:6px 9px;font-weight:700}
.pill.ok{background:#e8f8ed;color:#248a46}
.pill.warn{background:#fff5dc;color:#9a6700}
.pill.red{background:#ffe9e7;color:#d92f25}
.hero{border-radius:22px;background:#111113;box-shadow:0 10px 25px rgba(0,0,0,.12)}
.modal-back{background:rgba(0,0,0,.32);backdrop-filter:blur(5px)}
.modal{border-radius:24px;box-shadow:0 24px 70px rgba(0,0,0,.20);border:1px solid rgba(60,60,67,.10)}
.toast{border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18)}

.stock-controls .input{background:rgba(255,255,255,.92)}
.login-screen{background:linear-gradient(180deg,#f2f2f7,#e9e9ee)!important}
.login-card{border-radius:28px!important;box-shadow:0 22px 60px rgba(0,0,0,.11)!important}

/* ===== Mardelle Glass UI ===== */
:root{

}

<body>
<div id="root"></div><div id="modal-root"></div><div id="toast-root"></div>
<script>
const SUPABASE_URL="https://gbnonclccokylumageyi.supabase.co";
const SUPABASE_KEY="sb_publishable_3STLdysvJrtk66W7vQ3Fng_ak4sech7";
let currentUser=null,currentPage="home";

const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const money=v=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(v||0));
const num=v=>Number(v||0);
const today=()=>new Date().toISOString().slice(0,10);
const dt=v=>v?new Date(v).toLocaleString("id-ID",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"-";
const q=v=>encodeURIComponent(String(v??""));

async function api(path,opt={}){
 const h={apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,Accept:"application/json"};
 if(opt.body!==undefined)h["Content-Type"]="application/json";
 if(opt.prefer)h.Prefer=opt.prefer;
 let r;try{r=await fetch(SUPABASE_URL+path,{method:opt.method||"GET",headers:h,body:opt.body===undefined?undefined:JSON.stringify(opt.body)})}catch(e){throw Error("Tidak bisa terhubung ke Supabase.")}
 const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch(e){d=t}
 if(!r.ok)throw Error(d?.message||d?.details||d?.hint||t||("HTTP "+r.status));return d;
}
const get=(t,p)=>api("/rest/v1/"+t+"?"+p);
const post=(t,b)=>api("/rest/v1/"+t+"?select=*",{method:"POST",body:b,prefer:"return=representation"});
const patch=(t,p,b)=>api("/rest/v1/"+t+"?"+p,{method:"PATCH",body:b,prefer:"return=representation"});
const del=(t,p)=>api("/rest/v1/"+t+"?"+p,{method:"DELETE"});
const rpc=(n,b)=>api("/rest/v1/rpc/"+n,{method:"POST",body:b});

function toast(m,type="ok"){const x=document.createElement("div");x.className="toast "+(type==="error"?"err":"ok");x.textContent=m;document.getElementById("toast-root").appendChild(x);setTimeout(()=>x.remove(),3300)}
function modal(title,body){document.getElementById("modal-root").innerHTML=`<div class="modal-back" id="mb"><div class="modal"><div class="modal-head"><h3>${title}</h3><button class="x" onclick="closeModal()">×</button></div>${body}</div></div>`;document.getElementById("mb").onclick=e=>{if(e.target.id==="mb")closeModal()}}
function closeModal(){document.getElementById("modal-root").innerHTML=""}
function B(t,fn,p=false,d=false){return `<button type="button" class="btn ${p?"primary":""} ${d?"danger":""}" onclick="${fn}">${t}</button>`}
function stat(l,v,h){return `<div class="card stat"><div class="label">${l}</div><div class="value">${v}</div><div class="hint">${h||""}</div></div>`}
function owner(){return currentUser?.role==="owner"}

function showPage(page){
 currentPage=page;
 renderShell();
}
function renderShell(){
 if(!currentUser){renderLogin();return}
 const allowed=menus.filter(m=>owner()||!["finance","owner"].includes(m[0]));
 document.getElementById("root").innerHTML=`<div class="shell">
 <aside class="sidebar"><div class="brand"><div class="logo">M</div><div class="profile-brand"><div class="profile-role" id="side-role">OWNER</div><div class="profile-name" id="side-name">Owner Mardelle</div></div></div><div class="nav-title">MENU</div><nav class="nav">${allowed.map(m=>`<button class="${currentPage===m[0]?"active":""}" onclick="showPage('${m[0]}')"><img class="nav-png-icon" src="${m[2]}" alt=""><span>${m[1]}</span></button>`).join("")}</nav><div class="sidebar-logout"><button type="button" onclick="logout()">↪ <span>Log out</span></button></div></aside>
 <section class="main"><header class="topbar"><div class="user">${currentUser.role.toUpperCase()} · ${esc(currentUser.full_name)}</div>${B("Logout","logout()")}</header><main class="content" id="content"></main></section>
 <nav class="mobile-nav">${allowed.slice(0,5).map(m=>`<button class="${currentPage===m[0]?"active":""}" onclick="showPage('${m[0]}')"><span class="nav-icon">${m[2]}</span><span>${m[1]}</span></button>`).join("")}</nav></div>`;
 const fn={home:pageHome,stok:pageStock,barang:pageBarang,pos:pagePOS,customer:pageCustomer,history:pageHistory,finance:pageFinance,owner:pageOwner}[currentPage]||pageHome;
 Promise.resolve(fn(document.getElementById("content"))).catch(e=>{console.error(e);document.getElementById("content").innerHTML=`<div class="card" style="padding:20px"><b style="color:#b91c1c">Halaman gagal dimuat</b><p class="small">${esc(e.message)}</p>${B("Coba lagi","showPage('"+currentPage+"')")}</div>`});
}
function renderLogin(){
 document.getElementById("root").innerHTML=`<div class="login-screen"><div class="card login-card"><div class="logo">M</div><h1>Mardelle Phone</h1><p>HP Management System</p><form id="lf"><div class="field" style="margin-top:22px"><label>PIN OWNER / STAFF</label><input id="pin" class="input" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off" required></div><button id="lb" class="btn primary" style="width:100%;margin-top:14px">Masuk Sistem</button></form><div id="ls" class="login-status">Supabase siap.</div></div></div>`;
 document.getElementById("lf").onsubmit=login;
}
async function login(e){
 e.preventDefault();const b=document.getElementById("lb"),s=document.getElementById("ls"),pin=document.getElementById("pin").value.trim();b.disabled=true;b.textContent="Menghubungkan...";s.textContent="Menghubungkan ke Supabase...";
 try{const r=await get("profiles","select=id,full_name,role,pin&pin=eq."+q(pin)+"&limit=1");if(!r?.length)throw Error("PIN tidak ditemukan.");currentUser=r[0];currentPage="home";renderShell()}catch(x){s.textContent="Login gagal: "+x.message;toast(x.message,"error")}finally{b.disabled=false;b.textContent="Masuk Sistem"}
}
function logout(){currentUser=null;currentPage="home";renderLogin()}

async function pageHome(el){
 const inv=await get("inventory_items","select=status"),avail=(inv||[]).filter(x=>x.status==="Tersedia").length,sold=(inv||[]).filter(x=>x.status==="Terjual").length;
 const recent=await get("sales_history","select=*&order=transaction_date.desc&limit=8");
 let revenue=0,profit=0;try{const a=await get("transaction_items","select=price,profit,transactions!inner(type)&transactions.type=eq.Penjualan");revenue=(a||[]).reduce((x,y)=>x+num(y.price),0);profit=(a||[]).reduce((x,y)=>x+num(y.profit),0)}catch(e){}
 el.innerHTML=`<div class="header"><div><h2>Dashboard</h2><p>Ringkasan operasional Mardelle Phone</p></div></div><div class="grid g4">${stat("Omzet",money(revenue),"Total penjualan")}${stat("Profit",owner()?money(profit):"••••••","Owner only")}${stat("Terjual",sold,"Unit terjual")}${stat("Stok",avail,"Unit tersedia")}</div>
 <div class="grid g2" style="margin-top:14px"><div class="card"><div class="split" style="padding:18px"><div><b>Transaksi Terbaru</b><div class="small sub">Penjualan</div></div>${B("Lihat","showPage('history')")}</div><div class="table-wrap"><table class="table"><thead><tr><th>Invoice</th><th>Produk</th><th>Customer</th><th class="right">Harga</th></tr></thead><tbody>${(recent||[]).map(r=>`<tr><td class="bold">${esc(r.invoice)}</td><td>${esc(r.brand)} ${esc(r.model)}</td><td>${esc(r.customer_name)}</td><td class="right">${money(r.sale_price)}</td></tr>`).join("")||`<tr><td colspan="4" class="empty">Belum ada transaksi.</td></tr>`}</tbody></table></div></div>
 <div class="card" style="padding:18px"><b>Quick Actions</b><div class="stack" style="margin-top:14px">${B("＋ Barang Masuk","showPage('barang')",true)}${B("＋ Penjualan","showPage('pos')")}${B("＋ Customer","newCustomer()")}${owner()?B("＋ Pengeluaran","newExpense()"):""}</div></div></div>`;
}

async function pageStock(el){
 const rows=await get("inventory_overview","select=*&order=created_at.desc");
 el.innerHTML=`<div class="header">
   <div><h2>Stok & IMEI</h2><p>Kelola unit berdasarkan IMEI</p></div>
   <div class="actions">${owner()?B("＋ Produk","newProduct()",true):""}</div>
 </div>

 <div class="card stock-controls">
   <div class="stock-search">
     <span class="stock-icon">⌕</span>
     <input id="ss" class="input" placeholder="Cari model / IMEI / supplier">
   </div>
   <div class="stock-status">
     <select id="sf" class="input stock-select">
       <option value="">Semua status</option>
       <option value="tersedia">Tersedia</option>
       <option value="terjual">Terjual</option>
       <option value="habis">Habis</option>
     </select>
   </div>
 </div>

 <div class="card table-wrap">
  <table class="table">
   <thead><tr>
    <th>Produk</th><th>IMEI</th><th>Status</th>
    ${owner()?"<th>HPP</th>":""}<th>Harga</th><th>Supplier</th><th></th>
   </tr></thead>
   <tbody>
    ${(rows||[]).map(i=>`<tr class="sr" data-s="${esc((i.brand+" "+i.model+" "+i.imei+" "+(i.supplier||"")).toLowerCase())}" data-st="${esc(i.status.toLowerCase())}">
      <td><b>${esc(i.brand)} ${esc(i.model)}</b><div class="tiny sub">${esc(i.storage)} · ${esc(i.color)}</div></td>
      <td>${esc(i.imei)}</td>
      <td><span class="pill ${i.status==="Tersedia"?"ok":i.status==="Terjual"?"warn":"red"}">${esc(i.status)}</span></td>
      ${owner()?`<td>${money(i.cost_price)}</td>`:""}
      <td>${money(i.sale_price)}</td>
      <td>${esc(i.supplier||"-")}</td>
      <td class="right">${B("Detail","editStock('"+i.id+"')")} ${owner()?B("Hapus","deleteStock('"+i.id+"')",false,true):""}</td>
    </tr>`).join("")||`<tr><td colspan="7" class="empty">Belum ada stok.</td></tr>`}
   </tbody>
  </table>
 </div>`;

 const apply=()=>{
   const s=document.getElementById("ss").value.toLowerCase().trim();
   const st=document.getElementById("sf").value.toLowerCase().trim();
   document.querySelectorAll(".sr").forEach(r=>{
     r.style.display=(!s||r.dataset.s.includes(s))&&(!st||r.dataset.st===st)?"":"none";
   });
 };
 document.getElementById("ss").oninput=apply;
 document.getElementById("sf").onchange=apply;
}
async function editStock(id){
 const i=(await get("inventory_items","select=*&id=eq."+q(id)+"&limit=1"))?.[0];if(!i)return;
 modal("Edit Stok",`<form id="se" class="form-grid"><div class="field full"><label>IMEI</label><input id="sei" class="input" value="${esc(i.imei)}" required></div><div class="field"><label>HPP</label><input id="sec" class="input" type="number" value="${i.cost_price}" ${owner()?"":"readonly"}></div><div class="field"><label>Harga Jual</label><input id="sep" class="input" type="number" value="${i.sale_price}" required></div><div class="field"><label>Status</label><select id="ses" class="select"><option ${i.status==="Tersedia"?"selected":""}>Tersedia</option><option ${i.status==="Terjual"?"selected":""}>Terjual</option><option ${i.status==="Habis"?"selected":""}>Habis</option></select></div><div class="field"><label>Supplier</label><input id="sesu" class="input" value="${esc(i.supplier||"")}"></div><div class="field full"><button class="btn primary" style="width:100%">Simpan</button></div></form>`);
 document.getElementById("se").onsubmit=async e=>{e.preventDefault();try{const row={imei:document.getElementById("sei").value.trim(),sale_price:num(document.getElementById("sep").value),status:document.getElementById("ses").value,supplier:document.getElementById("sesu").value.trim()};if(owner())row.cost_price=num(document.getElementById("sec").value);await patch("inventory_items","id=eq."+q(id),row);closeModal();toast("Stok diperbarui");showPage("stok")}catch(x){toast(x.message,"error")}}
}
async function deleteStock(id){if(!owner())return;if(!confirm("Hapus stok ini?"))return;try{await del("inventory_items","id=eq."+q(id));toast("Stok dihapus");showPage("stok")}catch(x){toast(x.message,"error")}}

async function pageBarang(el){
 el.innerHTML=`<div class="header"><div><h2>Barang Masuk</h2><p>Input manual semua HP baru</p></div></div><div class="card" style="padding:20px"><div class="muted" style="margin-bottom:18px"><b>Input Manual</b><div class="small sub">HP keluaran terbaru bisa langsung dimasukkan tanpa membuat master terlebih dahulu.</div></div><form id="bf" class="form-grid">
 <div class="field"><label>Brand</label><input id="bb" class="input" required></div><div class="field"><label>Model</label><input id="bm" class="input" required></div><div class="field"><label>Storage</label><input id="bs" class="input" required></div><div class="field"><label>Warna</label><input id="bc" class="input" required></div><div class="field full"><label>IMEI</label><input id="bi" class="input" inputmode="numeric" required></div><div class="field"><label>HPP</label><input id="bco" class="input" type="number" value="0" ${owner()?"":"readonly"}></div><div class="field"><label>Harga Jual</label><input id="bsp" class="input" type="number" required></div><div class="field"><label>Supplier</label><input id="bss" class="input"></div><div class="field"><label>Tanggal</label><input id="bd" class="input" type="date" value="${today()}"></div><div class="field"><label>Kondisi</label><select id="bcond" class="select"><option>Baru</option><option>Bekas</option></select></div><div class="field full"><button class="btn primary" style="width:100%">Simpan Barang Masuk</button></div></form></div>`;
 document.getElementById("bf").onsubmit=async e=>{e.preventDefault();try{
  const g=id=>document.getElementById(id).value.trim(),imei=g("bi"),brand=g("bb"),model=g("bm"),storage=g("bs"),color=g("bc"),sale=num(g("bsp"));if(!/^\d{8,20}$/.test(imei))throw Error("IMEI harus 8–20 digit.");if(sale<=0)throw Error("Harga jual wajib diisi.");
  if((await get("inventory_items","select=id&imei=eq."+q(imei)+"&limit=1"))?.length)throw Error("IMEI sudah terdaftar.");
  let p=(await get("products","select=*&brand=eq."+q(brand)+"&model=eq."+q(model)+"&storage=eq."+q(storage)+"&color=eq."+q(color)+"&limit=1"))?.[0];if(!p)p=(await post("products",{brand,model,storage,color,base_sale_price:sale}))[0];
  await post("inventory_items",{product_id:p.id,imei,cost_price:owner()?num(g("bco")):0,sale_price:sale,status:"Tersedia",supplier:g("bss"),purchase_date:g("bd"),condition:g("bcond")});
  toast("Barang masuk berhasil disimpan");e.target.reset();document.getElementById("bd").value=today();
 }catch(x){toast(x.message,"error")}}
}

async function pagePOS(el){
 const items=await get("inventory_overview","select=*&status=eq.Tersedia&order=brand,model"),cs=await get("customers","select=*&order=name");
 el.innerHTML=`<div class="header"><div><h2>Penjualan / POS</h2><p>Customer bisa langsung ditambahkan saat transaksi.</p></div></div>
 <div class="grid g2">
 <div class="card" style="padding:20px"><form id="posf">
  <div class="field"><label>Unit / IMEI</label><select id="pi" class="select" required><option value="">Pilih unit...</option>${(items||[]).map(i=>`<option value="${i.id}" data-price="${i.sale_price}">${esc(i.brand)} ${esc(i.model)} · ${esc(i.storage)} · ${esc(i.color)} · IMEI ${esc(i.imei)} · ${money(i.sale_price)}</option>`).join("")}</select></div>

  <div class="field" style="margin-top:14px"><label>Customer</label>
   <select id="customer-mode" class="select">
    <option value="existing">Customer Lama</option>
    <option value="new">Customer Baru</option>
    <option value="walkin">Walk-in / Tanpa Data</option>
   </select>
  </div>

  <div id="existing-customer" class="field" style="margin-top:12px">
   <select id="pcc" class="select"><option value="">Pilih customer lama...</option>${(cs||[]).map(c=>`<option value="${c.id}">${esc(c.name)}${c.phone?" · "+esc(c.phone):""}</option>`).join("")}</select>
  </div>

  <div id="new-customer" class="card hidden" style="padding:14px;margin-top:12px;background:var(--soft)">
   <div class="small bold">Customer Baru</div>
   <div class="form-grid" style="margin-top:10px">
    <div class="field"><label>Nama Customer</label><input id="new-name" class="input" placeholder="Nama pembeli"></div>
    <div class="field"><label>No. HP <span class="sub">(opsional)</span></label><input id="new-phone" class="input" inputmode="tel" placeholder="08xxxxxxxxxx"></div>
   </div>
   <div class="tiny sub" style="margin-top:8px">Data akan otomatis disimpan ke database Customer ketika transaksi berhasil.</div>
  </div>

  <div class="form-grid" style="margin-top:14px"><div class="field"><label>Harga Jual</label><input id="pprice" class="input" type="number" required></div><div class="field"><label>Diskon</label><input id="pdisc" class="input" type="number" value="0" min="0"></div></div>
  <div class="form-grid" style="margin-top:14px"><div class="field"><label>Metode Pembayaran</label><select id="pmet" class="select"><option>Cash</option><option>Transfer</option><option>E-Wallet</option></select></div><div class="field"><label>Status Pembayaran</label><select id="pstat" class="select"><option>Lunas</option><option>Sebagian</option><option>Belum Bayar</option></select></div></div>
  <div class="field" style="margin-top:14px"><label>Catatan</label><textarea id="pnote" class="textarea" rows="3" placeholder="Opsional"></textarea></div>
  <button id="save-sale" class="btn primary" style="width:100%;margin-top:14px">Simpan Penjualan</button>
 </form></div>

 <div class="card" style="padding:20px"><b>Ringkasan Transaksi</b><div id="pt" style="margin-top:14px"></div>
  <div class="muted small" style="margin-top:14px">Customer baru akan otomatis masuk ke database dan bisa dipakai lagi pada transaksi berikutnya.</div>
 </div></div>`;

 const mode=document.getElementById("customer-mode"),existingBox=document.getElementById("existing-customer"),newBox=document.getElementById("new-customer");
 const item=document.getElementById("pi"),price=document.getElementById("pprice"),disc=document.getElementById("pdisc"),summary=document.getElementById("pt");
 const refreshCustomerMode=()=>{
   existingBox.classList.toggle("hidden",mode.value!=="existing");
   newBox.classList.toggle("hidden",mode.value!=="new");
 };
 mode.onchange=refreshCustomerMode;

 const calc=()=>{
   const o=item.options[item.selectedIndex],p=num(price.value||o?.dataset.price),d=Math.min(Math.max(num(disc.value),0),p);
   summary.innerHTML=`<div class="hero"><div class="tiny" style="opacity:.7">TOTAL TRANSAKSI</div><div class="value">${money(Math.max(0,p-d))}</div><div class="small" style="opacity:.7;margin-top:5px">Harga ${money(p)} · Diskon ${money(d)}</div></div>`;
 };
 item.onchange=()=>{price.value=item.options[item.selectedIndex]?.dataset.price||"";calc()};
 price.oninput=calc;disc.oninput=calc;

 document.getElementById("posf").onsubmit=async e=>{
   e.preventDefault();
   const save=document.getElementById("save-sale");save.disabled=true;save.textContent="Menyimpan...";
   try{
     const selected=item.value,p=num(price.value),d=Math.min(Math.max(num(disc.value),0),p),total=p-d;
     if(!selected)throw Error("Pilih HP / IMEI terlebih dahulu.");
     if(p<=0)throw Error("Harga jual wajib diisi.");

     let customerId=null;
     if(mode.value==="existing"){
       customerId=document.getElementById("pcc").value||null;
     }else if(mode.value==="new"){
       const name=document.getElementById("new-name").value.trim(),phone=document.getElementById("new-phone").value.trim();
       if(!name)throw Error("Nama customer baru wajib diisi.");
       const created=(await post("customers",{name,phone}))[0];
       customerId=created.id;
     }

     const transaction=(await post("transactions",{
       invoice:"INV-"+Date.now(),
       type:"Penjualan",
       customer_id:customerId,
       total_amount:total,
       discount:d,
       payment_status:document.getElementById("pstat").value,
       payment_method:document.getElementById("pmet").value,
       notes:document.getElementById("pnote").value.trim(),
       transaction_date:new Date().toISOString()
     }))[0];

     try{
       await rpc("create_sale_item",{p_transaction_id:transaction.id,p_inventory_item_id:selected,p_price:total});
     }catch(err){
       await del("transactions","id=eq."+q(transaction.id));
       if(mode.value==="new" && customerId)await del("customers","id=eq."+q(customerId));
       throw err;
     }

     toast(mode.value==="new"?"Penjualan & customer baru berhasil disimpan":"Penjualan berhasil disimpan");
     showPage("history");
   }catch(err){
     toast(err.message,"error");
   }finally{
     save.disabled=false;save.textContent="Simpan Penjualan";
   }
 };
}
