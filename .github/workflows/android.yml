name: Build Mardelle Phone APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Capacitor project
        shell: bash
        run: |
          set -e

          cat > package.json <<'EOF'
          {
            "name": "mardelle-phone",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "sync": "cap sync android"
            },
            "dependencies": {
              "@capacitor/core": "^7.4.0",
              "@capacitor/android": "^7.4.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.0"
            }
          }
          EOF

          npm install

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.mardelle.phone",
            "appName": "Mardelle Phone",
            "webDir": "www"
          }
          EOF

          rm -rf www
          mkdir -p www

          if [ ! -f index.html ]; then
            echo "ERROR: index.html tidak ditemukan di repository."
            exit 1
          fi

          cp index.html www/index.html

          if [ -f manifest.webmanifest ]; then
            cp manifest.webmanifest www/manifest.webmanifest
          fi

          if [ -f manifest.json ]; then
            cp manifest.json www/manifest.json
          fi

          if [ -f service-worker.js ]; then
            cp service-worker.js www/service-worker.js
          fi

          if [ -f sw.js ]; then
            cp sw.js www/sw.js
          fi

          if [ -f icon-192.png ]; then
            cp icon-192.png www/icon-192.png
          fi

          if [ -f icon-512.png ]; then
            cp icon-512.png www/icon-512.png
          fi

      - name: Add Android
        shell: bash
        run: |
          set -e
          npx cap add android

      - name: Sync Android
        shell: bash
        run: |
          set -e
          npx cap sync android

      - name: Configure Android
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          text = text.replace(
              'android:theme="@style/AppTheme"',
              'android:theme="@style/AppTheme"',
              1
          )

          manifest.write_text(text)
          PY

          mkdir -p android/app/src/main/java/com/mardelle/phone

          cat > android/app/src/main/java/com/mardelle/phone/MainActivity.java <<'EOF'
          package com.mardelle.phone;

          import android.os.Bundle;
          import android.view.View;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          text = text.replace(
              '<activity',
              '<activity android:screenOrientation="landscape"',
              1
          )

          manifest.write_text(text)
          PY

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd android

          chmod +x gradlew

          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mardelle-Phone-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
