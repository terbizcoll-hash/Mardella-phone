
name: Build Mardelle Phone APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Capacitor project
        run: |
          cat > package.json <<'EOF'
          {
            "name": "mardelle-phone",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "sync": "cap sync android"
            },
            "dependencies": {
              "@capacitor/core": "^7.4.0",
              "@capacitor/android": "^7.4.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.0"
            }
          }
          EOF

          npm install

          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.mardelle.phone',
            appName: 'Mardelle Phone',
            webDir: 'www',
            bundledWebRuntime: false
          };

          export default config;
          EOF

          mkdir -p www

          if [ -f index.html ]; then
            cp index.html www/index.html
          else
            echo "index.html tidak ditemukan!"
            exit 1
          fi

      - name: Add Android
        run: |
          npx cap add android

      - name: Sync Android
        run: |
          npx cap sync android

      - name: Configure fullscreen
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          s = s.replace(
              '<activity',
              '<activity android:screenOrientation="landscape" android:exported="true"',
              1
          )

          p.write_text(s)
          PY

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Mardelle-Phone-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
